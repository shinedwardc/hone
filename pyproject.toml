[project]
name = "hone"
version = "0.1.0"
description = "A coding agent that reads, runs, and rewrites code inside a directory it cannot escape."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.44.0",
    "python-dotenv==1.1.0",
]

[project.scripts]
hone = "hone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["hone"]
